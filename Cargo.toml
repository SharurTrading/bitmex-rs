[package]
name = "bitmex-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT-0"
description = "Async provider-native BitMEX REST and WebSocket client"
repository = "https://github.com/SharurTrading/bitmex-rs"
readme = "README.md"

[features]
default = []
live-tests = []

[dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "io-util", "test-util"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
